- name: Security Compliance Audit (No Fix Mode)
  hosts: all
  become: yes

  vars:
    qradar_ip: "192.168.121.21:514"
    qradar_pattern: "*.* @@192.168.121.21:514"

  tasks:

    # -----------------------------
    # 1. SERVİS KONTROLÜ
    # -----------------------------
    - name: Check auditd service
      command: systemctl is-active auditd
      register: auditd_status
      failed_when: false
      changed_when: false

    - name: Check rsyslog service
      command: systemctl is-active rsyslog
      register: rsyslog_status
      failed_when: false
      changed_when: false

    # -----------------------------
    # 2. BASH LOGGING
    # -----------------------------
    - name: Check bash.log exists
      stat:
        path: /var/log/bash.log
      register: bash_log

    - name: Check /etc/profile logging
      shell: grep -F "history_to_syslog" /etc/profile
      register: profile_check
      failed_when: false
      changed_when: false

    - name: Check root bashrc logging
      shell: grep -F "history_to_syslog" /root/.bashrc
      register: bashrc_check
      failed_when: false
      changed_when: false

    # -----------------------------
    # 3. AUDIT PLUGIN
    # -----------------------------
    - name: Check audit syslog plugin
      shell: grep -F "active = yes" /etc/audit/plugins.d/syslog.conf
      register: audit_plugin
      failed_when: false
      changed_when: false

    # -----------------------------
    # 4. QRADAR CONFIG
    # -----------------------------
    - name: Check QRadar forwarding in rsyslog.conf
      shell: grep -F "*.* @@192.168.121.21:514" /etc/rsyslog.conf
      register: qradar_check
      failed_when: false
      changed_when: false

    # -----------------------------
    # 5. RSYSLOG FILES
    # -----------------------------
    - name: Check bash rsyslog config
      stat:
        path: /etc/rsyslog.d/bash.conf
      register: bash_rsyslog_conf

    - name: Check audit imfile config
      shell: grep -F "/var/log/audit/audit.log" /etc/rsyslog.conf
      register: audit_imfile
      failed_when: false
      changed_when: false

    # -----------------------------
    # 6. RAPOR
    # -----------------------------
    - name: Compliance Report
      debug:
        msg:
          - "AUDITD: {{ 'OK' if auditd_status.stdout == 'active' else 'MISSING' }}"
          - "RSYSLOG: {{ 'OK' if rsyslog_status.stdout == 'active' else 'MISSING' }}"
          - "BASH LOG FILE: {{ 'OK' if bash_log.stat.exists else 'MISSING' }}"
          - "PROFILE LOG: {{ 'OK' if profile_check.rc == 0 else 'MISSING' }}"
          - "ROOT BASHRC LOG: {{ 'OK' if bashrc_check.rc == 0 else 'MISSING' }}"
          - "AUDIT PLUGIN: {{ 'OK' if audit_plugin.rc == 0 else 'MISSING' }}"
          - "QRADAR FORWARD: {{ 'OK' if qradar_check.rc == 0 else 'MISSING' }}"
          - "RSYSLOG BASH CONF: {{ 'OK' if bash_rsyslog_conf.stat.exists else 'MISSING' }}"
          - "AUDIT IMFILE: {{ 'OK' if audit_imfile.rc == 0 else 'MISSING' }}"
