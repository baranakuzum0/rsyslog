---
- name: Bash + Audit + Rsyslog Compliance Check (STRICT)
  hosts: all
  become: yes
  gather_facts: no

  tasks:

  # =====================================================
  # 1. BASH LOGGING (/etc/profile + /root/.bashrc)
  # =====================================================
  - name: Check bash logging in /etc/profile
    shell: grep -q "history_to_syslog" /etc/profile && echo "PASS" || echo "FAIL"
    register: profile
    changed_when: false

  - name: Check bash logging in /root/.bashrc
    shell: grep -q "history_to_syslog" /root/.bashrc && echo "PASS" || echo "FAIL"
    register: bashrc
    changed_when: false

  - debug:
      msg:
        - "/etc/profile => {{ profile.stdout }}"
        - "/root/.bashrc => {{ bashrc.stdout }}"

  # =====================================================
  # 2. AUDIT PLUGIN CHECK
  # =====================================================
  - name: Check audit plugin active=yes
    shell: grep -R "active *= *yes" /etc/audit /etc/audisp 2>/dev/null && echo "PASS" || echo "FAIL"
    register: audit
    changed_when: false

  - debug:
      msg: "audit plugin => {{ audit.stdout }}"

  # =====================================================
  # 3. RSYSLOG QRADAR FORWARD
  # =====================================================
  - name: Check QRadar forwarding IP
    shell: grep -R "192.168.121.21" /etc/rsyslog* 2>/dev/null && echo "PASS" || echo "FAIL"
    register: qradar
    changed_when: false

  - debug:
      msg: "QRadar => {{ qradar.stdout }}"

  # =====================================================
  # 4. RSYSLOG AUDIT IMFILE CONFIG
  # =====================================================
  - name: Check audit imfile config
    shell: |
      grep -q "/var/log/audit/audit.log" /etc/rsyslog* &&
      grep -q "InputFileFacility local6" /etc/rsyslog* &&
      grep -q "InputRunFileMonitor" /etc/rsyslog* &&
      echo "PASS" || echo "FAIL"
    register: rsyslog_audit
    changed_when: false

  - debug:
      msg: "rsyslog audit => {{ rsyslog_audit.stdout }}"

  # =====================================================
  # 5. BASH LOG FILE + RSYSLOG RULE
  # =====================================================
  - name: Check bash.log file + rsyslog rule
    shell: |
      [ -f /var/log/bash.log ] &&
      grep -q "local5.debug" /etc/rsyslog.d/ 2>/dev/null &&
      echo "PASS" || echo "FAIL"
    register: bashlog
    changed_when: false

  - debug:
      msg: "bash logging system => {{ bashlog.stdout }}"

  # =====================================================
  # 6. 50-DEFAULT CONF RULES CHECK
  # =====================================================
  - name: Check rsyslog default rules
    shell: |
      grep -q "auth,authpriv" /etc/rsyslog.d/50-default.conf &&
      grep -q "cron" /etc/rsyslog.d/50-default.conf &&
      grep -q "local1" /etc/rsyslog.d/50-default.conf &&
      grep -q "mail.err" /etc/rsyslog.d/50-default.conf &&
      grep -q "emerg" /etc/rsyslog.d/50-default.conf &&
      echo "PASS" || echo "FAIL"
    register: default_rules
    changed_when: false

  - debug:
      msg: "rsyslog rules => {{ default_rules.stdout }}"

  # =====================================================
  # 7. FINAL RESULT
  # =====================================================
  - name: Final compliance summary
    debug:
      msg:
        - "======================================"
        - "COMPLIANCE REPORT"
        - "======================================"
        - "/etc/profile => {{ profile.stdout }}"
        - "/root/.bashrc => {{ bashrc.stdout }}"
        - "audit plugin => {{ audit.stdout }}"
        - "QRadar => {{ qradar.stdout }}"
        - "rsyslog audit => {{ rsyslog_audit.stdout }}"
        - "bash log => {{ bashlog.stdout }}"
        - "default rules => {{ default_rules.stdout }}"
        - "======================================"
