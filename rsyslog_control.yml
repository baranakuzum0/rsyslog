---
- name: Real Compliance Engine (Deep Check + Score)
  hosts: all
  become: yes
  gather_facts: no

  vars:
    score: 0
    max_score: 8

  tasks:

  # =====================================================
  # HEADER
  # =====================================================
  - name: Start report
    debug:
      msg:
        - "======================================"
        - "   REAL COMPLIANCE ENGINE REPORT      "
        - "======================================"
        - "Host: {{ inventory_hostname }}"

  # =====================================================
  # 1. /etc/profile CHECK (DEEP)
  # =====================================================
  - name: Check /etc/profile required lines
    shell: |
      missing=0

      grep -q "history_to_syslog" /etc/profile || echo "MISSING: history_to_syslog"
      grep -q "trap history_to_syslog DEBUG" /etc/profile || echo "MISSING: trap DEBUG"
      grep -q "logger -p local5.debug" /etc/profile || echo "MISSING: logger local5"

      grep -q "history_to_syslog" /etc/profile && grep -q "trap history_to_syslog DEBUG" /etc/profile && grep -q "logger -p local5.debug" /etc/profile
      if [ $? -eq 0 ]; then echo "STATUS: FULL"; else echo "STATUS: FAIL"; fi
    register: profile
    changed_when: false

  - debug:
      msg: "{{ profile.stdout_lines }}"

  # =====================================================
  # 2. /root/.bashrc CHECK
  # =====================================================
  - name: Check /root/.bashrc deep config
    shell: |
      grep -q "history_to_syslog" /root/.bashrc || echo "MISSING: function"
      grep -q "old_command" /root/.bashrc || echo "MISSING: old_command"
      grep -q "logger -p local5.debug" /root/.bashrc || echo "MISSING: logger"
    register: bashrc
    changed_when: false

  - debug:
      msg: "{{ bashrc.stdout_lines }}"

  # =====================================================
  # 3. BASH LOG FILE CHECK
  # =====================================================
  - name: Check bash log system completeness
    shell: |
      [ -f /var/log/bash.log ] || echo "MISSING: bash.log file"
      grep -R "local5.debug" /etc/rsyslog* >/dev/null 2>&1 || echo "MISSING: rsyslog rule"
      grep -R "bash.log" /etc/rsyslog* >/dev/null 2>&1 || echo "MISSING: rsyslog mapping"
    register: bashlog
    changed_when: false

  - debug:
      msg: "{{ bashlog.stdout_lines }}"

  # =====================================================
  # 4. AUDITD CHECK
  # =====================================================
  - name: Audit plugin deep check
    shell: |
      grep -R "active *= *yes" /etc/audit /etc/audisp 2>/dev/null || echo "MISSING: active=yes"
      grep -R "syslog.conf" /etc/audit/plugins.d /etc/audisp/plugins.d 2>/dev/null || echo "MISSING: syslog plugin"
    register: audit
    changed_when: false

  - debug:
      msg: "{{ audit.stdout_lines }}"

  # =====================================================
  # 5. RSYSLOG AUDIT CHECK
  # =====================================================
  - name: Rsyslog audit deep validation
    shell: |
      grep -R "InputFileName /var/log/audit/audit.log" /etc/rsyslog* >/dev/null 2>&1 || echo "MISSING: audit file input"
      grep -R "InputFileFacility local6" /etc/rsyslog* >/dev/null 2>&1 || echo "MISSING: local6 facility"
      grep -R "InputRunFileMonitor" /etc/rsyslog* >/dev/null 2>&1 || echo "MISSING: monitor"
    register: rsyslog_audit
    changed_when: false

  - debug:
      msg: "{{ rsyslog_audit.stdout_lines }}"

  # =====================================================
  # 6. QRADAR CHECK
  # =====================================================
  - name: QRadar forwarding check
    shell: |
      grep -R "192.168.121.21" /etc/rsyslog* >/dev/null 2>&1 || echo "MISSING: QRadar IP"
    register: qradar
    changed_when: false

  - debug:
      msg: "{{ qradar.stdout_lines }}"

  # =====================================================
  # 7. SCORING ENGINE
  # =====================================================
  - name: Calculate compliance score
    set_fact:
      score_calc: >-
        {{
          (
            (0 if 'MISSING' in profile.stdout else 1) +
            (0 if 'MISSING' in bashrc.stdout else 1) +
            (0 if 'MISSING' in bashlog.stdout else 1) +
            (0 if 'MISSING' in audit.stdout else 1) +
            (0 if 'MISSING' in rsyslog_audit.stdout else 1) +
            (0 if 'MISSING' in qradar.stdout else 1)
          )
        }}

  - name: Show compliance score
    debug:
      msg:
        - "======================================"
        - "COMPLIANCE SCORE: {{ score_calc }}/6"
        - >-
          STATUS:
          {% if score_calc == 6 %}
          FULL COMPLIANT
          {% elif score_calc >= 4 %}
          PARTIAL COMPLIANT
          {% else %}
          NON COMPLIANT
          {% endif %}
        - "======================================"
