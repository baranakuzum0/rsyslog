---
- name: Linux Security Compliance Report (Readable)
  hosts: all
  become: yes

  tasks:

  # -------------------------
  # HEADER
  # -------------------------
  - name: Start report header
    debug:
      msg:
        - "======================================"
        - "     SECURITY COMPLIANCE REPORT       "
        - "======================================"

  # -------------------------
  # /etc/profile
  # -------------------------
  - name: Check /etc/profile
    shell: grep -q "logger" /etc/profile && echo "PASS" || echo "FAIL"
    register: profile

  - debug:
      msg: "/etc/profile (bash logging) => {{ profile.stdout }}"

  # -------------------------
  # /root/.bashrc
  # -------------------------
  - name: Check /root/.bashrc
    shell: grep -q "history_to_syslog\|trap\|logger" /root/.bashrc && echo "PASS" || echo "FAIL"
    register: bashrc

  - debug:
      msg: "/root/.bashrc (bash logging) => {{ bashrc.stdout }}"

  # -------------------------
  # audit plugin
  # -------------------------
  - name: Check audit syslog plugin
    stat:
      path: /etc/audit/plugins.d/syslog.conf
    register: audit_new

  - debug:
      msg: "Audit plugin (/etc/audit) => {{ 'PASS' if audit_new.stat.exists else 'FAIL' }}"

  - name: Check old audit plugin path
    stat:
      path: /etc/audisp/plugins.d/syslog.conf
    register: audit_old

  - debug:
      msg: "Audit plugin (/etc/audisp) => {{ 'PASS' if audit_old.stat.exists else 'FAIL' }}"

  # -------------------------
  # audit active
  # -------------------------
  - name: Check audit active
    shell: grep -R "active *= *yes" /etc/audit /etc/audisp 2>/dev/null | wc -l
    register: audit_active
    changed_when: false

  - debug:
      msg: "Audit ACTIVE config => {{ 'PASS' if audit_active.stdout|int > 0 else 'FAIL' }}"

  # -------------------------
  # rsyslog audit forwarding
  # -------------------------
  - name: Check rsyslog audit forwarding
    shell: grep -R "/var/log/audit/audit.log" /etc/rsyslog* 2>/dev/null | wc -l
    register: rsyslog_audit
    changed_when: false

  - debug:
      msg: "RSYSLOG audit forward => {{ 'PASS' if rsyslog_audit.stdout|int > 0 else 'FAIL' }}"

  # -------------------------
  # bash.log file
  # -------------------------
  - name: Check bash.log
    stat:
      path: /var/log/bash.log
    register: bashlog

  - debug:
      msg: "bash.log file => {{ 'PASS' if bashlog.stat.exists else 'FAIL' }}"

  # -------------------------
  # FOOTER
  # -------------------------
  - name: End report
    debug:
      msg:
        - "======================================"
        - "           REPORT END                 "
        - "======================================"
