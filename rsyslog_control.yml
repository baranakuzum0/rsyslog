---
- name: Bash + Audit + Rsyslog Existence Check
  hosts: all
  become: yes

  tasks:

  # -------------------------
  # /etc/profile kontrol
  # -------------------------
  - name: Check /etc/profile bash logging exists
    shell: grep -q "logger" /etc/profile && echo "EXISTS" || echo "MISSING"
    register: profile_result
    changed_when: false

  - debug:
      msg: "/etc/profile => {{ profile_result.stdout }}"

  # -------------------------
  # /root/.bashrc kontrol
  # -------------------------
  - name: Check /root/.bashrc logging exists
    shell: grep -q "history_to_syslog\|logger\|trap" /root/.bashrc && echo "EXISTS" || echo "MISSING"
    register: bashrc_result
    changed_when: false

  - debug:
      msg: "/root/.bashrc => {{ bashrc_result.stdout }}"

  # -------------------------
  # audit plugin kontrol
  # -------------------------
  - name: Check audit syslog plugin (new path)
    stat:
      path: /etc/audit/plugins.d/syslog.conf
    register: audit_new

  - debug:
      msg: "/etc/audit/plugins.d/syslog.conf => {{ audit_new.stat.exists }}"

  - name: Check audit syslog plugin (old path)
    stat:
      path: /etc/audisp/plugins.d/syslog.conf
    register: audit_old

  - debug:
      msg: "/etc/audisp/plugins.d/syslog.conf => {{ audit_old.stat.exists }}"

  # -------------------------
  # audit active kontrol
  # -------------------------
  - name: Check audit plugin active=yes
    shell: grep -R "active *= *yes" /etc/audit /etc/audisp 2>/dev/null || echo "NOT FOUND"
    register: audit_active
    changed_when: false

  - debug:
      msg: "audit active => {{ audit_active.stdout }}"

  # -------------------------
  # rsyslog audit log kontrol
  # -------------------------
  - name: Check rsyslog audit forwarding
    shell: grep -R "/var/log/audit/audit.log" /etc/rsyslog* 2>/dev/null || echo "NOT FOUND"
    register: rsyslog_audit
    changed_when: false

  - debug:
      msg: "rsyslog audit => {{ rsyslog_audit.stdout }}"

  # -------------------------
  # bash.log kontrol
  # -------------------------
  - name: Check /var/log/bash.log exists
    stat:
      path: /var/log/bash.log
    register: bashlog

  - debug:
      msg: "/var/log/bash.log => {{ bashlog.stat.exists }}"

  # -------------------------
  # rsyslog rules kontrol
  # -------------------------
  - name: Check rsyslog rules existence
    shell: grep -E "auth,authpriv|cron|local1|mail|syslog" /etc/rsyslog* 2>/dev/null || echo "NOT FOUND"
    register: rsyslog_rules
    changed_when: false

  - debug:
      msg: "rsyslog rules => {{ rsyslog_rules.stdout }}"
