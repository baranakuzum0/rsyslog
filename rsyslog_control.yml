---
- name: Linux Security Compliance Engine (FINAL STABLE)
  hosts: all
  become: yes
  gather_facts: no

  tasks:

  # =====================================================
  # HEADER
  # =====================================================
  - name: Start report
    debug:
      msg:
        - "======================================"
        - "   REAL COMPLIANCE ENGINE REPORT      "
        - "======================================"
        - "Host: {{ inventory_hostname }}"
        - "======================================"

  # =====================================================
  # 1. /etc/profile CHECK
  # =====================================================
  - name: Check /etc/profile (bash logging)
    shell: |
      missing=""
      grep -q "history_to_syslog" /etc/profile || missing="${missing} history_to_syslog"
      grep -q "trap history_to_syslog DEBUG" /etc/profile || missing="${missing} trap_DEBUG"
      grep -q "logger -p local5.debug" /etc/profile || missing="${missing} logger_local5"

      if [ -z "$missing" ]; then
        echo "OK"
      else
        echo "MISSING:$missing"
      fi
    register: profile
    changed_when: false

  - debug:
      msg: "/etc/profile => {{ profile.stdout }}"

  # =====================================================
  # 2. /root/.bashrc CHECK
  # =====================================================
  - name: Check /root/.bashrc
    shell: |
      missing=""
      grep -q "history_to_syslog" /root/.bashrc || missing="${missing} function"
      grep -q "old_command" /root/.bashrc || missing="${missing} old_command"
      grep -q "logger -p local5.debug" /root/.bashrc || missing="${missing} logger"

      if [ -z "$missing" ]; then
        echo "OK"
      else
        echo "MISSING:$missing"
      fi
    register: bashrc
    changed_when: false

  - debug:
      msg: "/root/.bashrc => {{ bashrc.stdout }}"

  # =====================================================
  # 3. BASH LOG FILE + RSYSLOG
  # =====================================================
  - name: Check bash logging system
    shell: |
      missing=""
      [ -f /var/log/bash.log ] || missing="bash.log_file"
      grep -R "local5.debug" /etc/rsyslog* >/dev/null 2>&1 || missing="${missing} rsyslog_rule"
      grep -R "bash.log" /etc/rsyslog* >/dev/null 2>&1 || missing="${missing} mapping"

      if [ -z "$missing" ]; then
        echo "OK"
      else
        echo "MISSING:$missing"
      fi
    register: bashlog
    changed_when: false

  - debug:
      msg: "bash system => {{ bashlog.stdout }}"

  # =====================================================
  # 4. AUDITD CHECK
  # =====================================================
  - name: Check audit configuration
    shell: |
      missing=""
      grep -R "active *= *yes" /etc/audit /etc/audisp 2>/dev/null || missing="active_yes"
      grep -R "syslog.conf" /etc/audit/plugins.d /etc/audisp/plugins.d 2>/dev/null || missing="${missing} plugin"

      if [ -z "$missing" ]; then
        echo "OK"
      else
        echo "MISSING:$missing"
      fi
    register: audit
    changed_when: false

  - debug:
      msg: "audit => {{ audit.stdout }}"

  # =====================================================
  # 5. RSYSLOG AUDIT CHECK
  # =====================================================
  - name: Check rsyslog audit forwarding
    shell: |
      missing=""
      grep -R "InputFileName /var/log/audit/audit.log" /etc/rsyslog* >/dev/null 2>&1 || missing="audit_input"
      grep -R "InputFileFacility local6" /etc/rsyslog* >/dev/null 2>&1 || missing="${missing} local6"
      grep -R "InputRunFileMonitor" /etc/rsyslog* >/dev/null 2>&1 || missing="${missing} monitor"

      if [ -z "$missing" ]; then
        echo "OK"
      else
        echo "MISSING:$missing"
      fi
    register: rsyslog_audit
    changed_when: false

  - debug:
      msg: "rsyslog audit => {{ rsyslog_audit.stdout }}"

  # =====================================================
  # 6. QRADAR CHECK
  # =====================================================
  - name: Check QRadar forwarding
    shell: |
      grep -R "192.168.121.21" /etc/rsyslog* >/dev/null 2>&1 && echo "OK" || echo "MISSING:QRadar_IP"
    register: qradar
    changed_when: false

  - debug:
      msg: "qradar => {{ qradar.stdout }}"

  # =====================================================
  # 7. SCORING ENGINE (FIXED TYPE SAFE)
  # =====================================================
  - name: Calculate compliance score (SAFE INT)
    set_fact:
      score_calc: >-
        {{
          (
            (0 if 'MISSING' in profile.stdout else 1) +
            (0 if 'MISSING' in bashrc.stdout else 1) +
            (0 if 'MISSING' in bashlog.stdout else 1) +
            (0 if 'MISSING' in audit.stdout else 1) +
            (0 if 'MISSING' in rsyslog_audit.stdout else 1) +
            (0 if 'MISSING' in qradar.stdout else 1)
          ) | int
        }}

  # =====================================================
  # 8. FINAL REPORT (NO TYPE ERROR FIXED)
  # =====================================================
  - name: Show final compliance report
    debug:
      msg:
        - "======================================"
        - "COMPLIANCE SCORE: {{ score_calc | int }}/6"
        - >-
          STATUS:
          {% set sc = score_calc | int %}
          {% if sc == 6 %}
          FULL COMPLIANT
          {% elif sc >= 4 %}
          PARTIAL COMPLIANT
          {% else %}
          NON COMPLIANT
          {% endif %}
        - "======================================"
