---
- name: BASH VE AUDIT LOG KONFIGURASYON KONTROL PLAYBOOK'U
  hosts: all
  gather_facts: yes
  vars:
    # Tam metinler - harfine kadar kontrol edilecek
    bash_log_kodu: |
      PORT=`who am i | awk '{ print $5 }' | sed 's/(//g' | sed 's/)//g'`
      logger -p local5.debug -t "Bash $LOGNAME $$" User $LOGNAME logged from $PORT
      function history_to_syslog
      {
      declare cmd
      declare p_dir
      declare LOG_NAME
      cmd=$(history 1)
      cmd=$(echo $cmd |awk '{print substr($0,length($1)+2)}')
      p_dir=$(pwd)
      LOG_NAME=$(echo $LOGNAME)
      if [ "$cmd" != "$old_command" ]; then
      logger -p local5.debug -- Bash SESSION = $$, from_remote_host = $PORT, USER = $LOG_NAME, PWD = $p_dir, CMD = "${cmd}"
      fi
      old_command=$cmd
      }
      trap history_to_syslog DEBUG || EXIT

    audit_log_bloku: |
      $ModLoad imfile
      $InputFileName /var/log/audit/audit.log
      $InputFileTag tag_audit_log_.$hostname:
      $InputFileStateFile audit_log
      $InputFileSeverity info
      $InputFileFacility local6
      $InputRunFileMonitor

    50default_kurallar:
      - "auth,authpriv.*                 /var/log/auth.log"
      - "*.*;auth,authpriv.none          -/var/log/syslog"
      - "cron.*                          /var/log/cron.log"
      - "local1.*                        /var/log/sudo.log"
      - "mail.err                        /var/log/mail.err"
      - "*.emerg                         :omusrmsg:*"

  tasks:
    # TASK 1: /etc/profile kontrolu - tam metin birebir
    - name: "KONTROL-1: /etc/profile icinde bash log kodu tam metin kontrolu"
      ansible.builtin.lineinfile:
        path: /etc/profile
        line: "{{ bash_log_kodu }}"
        state: present
      check_mode: yes
      register: profile_kontrol
      failed_when: false

    - name: "RAPOR-1: /etc/profile durumu"
      ansible.builtin.debug:
        msg: 
          - "=== /etc/profile ==="
          - "Durum: {% if not profile_kontrol.changed %}DOGRU - Tam metin eslesiyor{% else %}HATALI veya EKSIK{% endif %}"
      when: not profile_kontrol.changed or profile_kontrol.changed

    # TASK 2: /root/.bashrc kontrolu
    - name: "KONTROL-2: /root/.bashrc icinde bash log kodu tam metin kontrolu"
      ansible.builtin.lineinfile:
        path: /root/.bashrc
        line: "{{ bash_log_kodu }}"
        state: present
      check_mode: yes
      register: bashrc_kontrol
      failed_when: false

    - name: "RAPOR-2: /root/.bashrc durumu"
      ansible.builtin.debug:
        msg:
          - "=== /root/.bashrc ==="
          - "Durum: {% if not bashrc_kontrol.changed %}DOGRU - Tam metin eslesiyor{% else %}HATALI veya EKSIK{% endif %}"

    # TASK 3: Audit plugin dosyasini bul
    - name: "KONTROL-3: Audit plugin dosyasinin varligi"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/audisp/plugins.d/syslog.conf
        - /etc/audit/plugins.d/syslog.conf
      register: audit_plugin_stat

    - name: "RAPOR-3: Audit plugin dosyasi"
      ansible.builtin.debug:
        msg:
          - "=== Audit Plugin ==="
          - "Dosya: {% for item in audit_plugin_stat.results if item.stat.exists %}{{ item.stat.path }}{% else %}BULUNAMADI{% endfor %}"
          - "active = yes kontrol: HENUZ YAPILMADI"

    # TASK 4: Audit plugin icinde "active = yes" kontrolu - harfine kadar
    - name: "KONTROL-4: Audit plugin icinde 'active = yes' harfine kadar kontrol"
      ansible.builtin.lineinfile:
        path: "{{ audit_plugin_dosyasi }}"
        line: "active = yes"
        state: present
      check_mode: yes
      register: audit_plugin_kontrol
      vars:
        audit_plugin_dosyasi: "{{ (audit_plugin_stat.results | selectattr('stat.exists', 'equalto', true) | first).stat.path | default('/tmp/yok') }}"
      when: audit_plugin_stat.results | selectattr('stat.exists', 'equalto', true) | list | length > 0

    - name: "RAPOR-4: Audit plugin 'active = yes' durumu"
      ansible.builtin.debug:
        msg:
          - "=== audit/audisp syslog.conf ==="
          - "Durum: {% if audit_plugin_kontrol is defined and not audit_plugin_kontrol.changed %}DOGRU - 'active = yes' var{% elif audit_plugin_kontrol is defined and audit_plugin_kontrol.changed %}HATALI - 'active = yes' yok veya farkli{% else %}DOSYA BULUNAMADI{% endif %}"
      when: audit_plugin_kontrol is defined

    # TASK 5: rsyslog.conf - QRadar IP kontrolu (192.168.121.21)
    - name: "KONTROL-5: rsyslog.conf icinde QRadar IP (192.168.121.21) tam metin kontrolu"
      ansible.builtin.lineinfile:
        path: /etc/rsyslog.conf
        line: "192.168.121.21"
        state: present
      check_mode: yes
      register: qradar_ip_kontrol
      failed_when: false

    - name: "RAPOR-5: QRadar IP durumu"
      ansible.builtin.debug:
        msg:
          - "=== rsyslog.conf - QRadar IP ==="
          - "Durum: {% if not qradar_ip_kontrol.changed %}DOGRU - 192.168.121.21 var{% else %}HATALI veya EKSIK - IP yok veya farkli{% endif %}"

    # TASK 6: rsyslog.conf - audit log blogu tam metin kontrol
    - name: "KONTROL-6: rsyslog.conf icinde audit log blogu tam metin kontrolu"
      ansible.builtin.blockinfile:
        path: /etc/rsyslog.conf
        block: "{{ audit_log_bloku }}"
        marker: ""
        state: present
      check_mode: yes
      register: audit_log_blogu_kontrol
      failed_when: false

    - name: "RAPOR-6: Audit log blogu durumu"
      ansible.builtin.debug:
        msg:
          - "=== rsyslog.conf - Audit Log Blogu ==="
          - "Durum: {% if not audit_log_blogu_kontrol.changed %}DOGRU - Tam metin eslesiyor{% else %}HATALI veya EKSIK{% endif %}"

    # TASK 7: /etc/rsyslog.d/bash.conf dosyasi ve icerigi
    - name: "KONTROL-7: bash.conf dosyasinin varligi"
      ansible.builtin.stat:
        path: /etc/rsyslog.d/bash.conf
      register: bash_conf_stat

    - name: "KONTROL-7B: bash.conf icerigi tam metin kontrolu"
      ansible.builtin.lineinfile:
        path: /etc/rsyslog.d/bash.conf
        line: "local5.debug           /var/log/bash.log"
        state: present
      check_mode: yes
      register: bash_conf_icerik_kontrol
      when: bash_conf_stat.stat.exists
      failed_when: false

    - name: "RAPOR-7: bash.conf durumu"
      ansible.builtin.debug:
        msg:
          - "=== /etc/rsyslog.d/bash.conf ==="
          - "Dosya: {% if bash_conf_stat.stat.exists %}VAR{% else %}YOK{% endif %}"
          - "Icerik: {% if bash_conf_icerik_kontrol is defined and not bash_conf_icerik_kontrol.changed %}DOGRU - 'local5.debug           /var/log/bash.log' var{% elif bash_conf_icerik_kontrol is defined and bash_conf_icerik_kontrol.changed %}HATALI - icerik farkli{% else %}DOSYA YOK{% endif %}"

    # TASK 8: /var/log/bash.log dosyasi ve izinler (640)
    - name: "KONTROL-8: bash.log dosya izinleri (640 olmali)"
      ansible.builtin.stat:
        path: /var/log/bash.log
      register: bash_log_stat

    - name: "RAPOR-8: bash.log durumu"
      ansible.builtin.debug:
        msg:
          - "=== /var/log/bash.log ==="
          - "Dosya: {% if bash_log_stat.stat.exists %}VAR{% else %}YOK{% endif %}"
          - "Izin: {% if bash_log_stat.stat.exists %}{{ bash_log_stat.stat.mode }}{% else %}N/A{% endif %}"
          - "Izin Kontrol: {% if bash_log_stat.stat.exists and bash_log_stat.stat.mode == '0640' %}DOGRU (640){% elif bash_log_stat.stat.exists %}HATALI (640 degil){% else %}DOSYA YOK{% endif %}"

    # TASK 9: 50-default.conf - tum kurallar satir satir kontrol
    - name: "KONTROL-9: 50-default.conf kurallari tam metin kontrolu"
      ansible.builtin.lineinfile:
        path: /etc/rsyslog.d/50-default.conf
        line: "{{ item }}"
        state: present
      check_mode: yes
      register: default50_kontroller
      loop: "{{ 50default_kurallar }}"
      failed_when: false

    - name: "RAPOR-9: 50-default.conf durumu"
      ansible.builtin.debug:
        msg:
          - "=== /etc/rsyslog.d/50-default.conf ==="
          - "auth,authpriv.*: {% for item in default50_kontroller.results if 'auth,authpriv' in item.line %}{% if not item.changed %}DOGRU{% else %}YOK veya HATALI{% endif %}{% endfor %}"
          - "syslog kurali: {% for item in default50_kontroller.results if 'syslog' in item.line %}{% if not item.changed %}DOGRU{% else %}YOK veya HATALI{% endif %}{% endfor %}"
          - "cron.*: {% for item in default50_kontroller.results if 'cron' in item.line %}{% if not item.changed %}DOGRU{% else %}YOK veya HATALI{% endif %}{% endfor %}"
          - "local1.* (sudo.log): {% for item in default50_kontroller.results if 'local1' in item.line %}{% if not item.changed %}DOGRU{% else %}YOK veya HATALI{% endif %}{% endfor %}"
          - "mail.err: {% for item in default50_kontroller.results if 'mail.err' in item.line %}{% if not item.changed %}DOGRU{% else %}YOK veya HATALI{% endif %}{% endfor %}"
          - "*.emerg: {% for item in default50_kontroller.results if 'emerg' in item.line %}{% if not item.changed %}DOGRU{% else %}YOK veya HATALI{% endif %}{% endfor %}"

    # TASK 10: Servis durumlari
    - name: "KONTROL-10: Rsyslog servis durumu"
      ansible.builtin.service:
        name: rsyslog
        state: started
      check_mode: yes
      register: rsyslog_durum
      failed_when: false

    - name: "RAPOR-10A: Rsyslog servisi"
      ansible.builtin.debug:
        msg: "=== Rsyslog: {% if rsyslog_durum is defined %}AKTIF{% else %}AKTIF DEGIL{% endif %} ==="

    - name: "KONTROL-10B: Auditd servis durumu"
      ansible.builtin.service:
        name: auditd
        state: started
      check_mode: yes
      register: auditd_durum
      failed_when: false

    - name: "RAPOR-10B: Auditd servisi"
      ansible.builtin.debug:
        msg: "=== Auditd: {% if auditd_durum is defined %}AKTIF{% else %}AKTIF DEGIL{% endif %} ==="

    # FINAL RAPOR
    - name: "===== FINAL RAPOR - TUM KONTROLLER TAMAMLANDI ====="
      ansible.builtin.debug:
        msg:
          - "************************************************"
          - "KONTROL SONUCLARI:"
          - "************************************************"
          - "1. /etc/profile: {% if not profile_kontrol.changed %}DOGRU{% else %}HATALI{% endif %}"
          - "2. /root/.bashrc: {% if not bashrc_kontrol.changed %}DOGRU{% else %}HATALI{% endif %}"
          - "3. Audit plugin active=yes: {% if audit_plugin_kontrol is defined and not audit_plugin_kontrol.changed %}DOGRU{% elif audit_plugin_kontrol is defined %}HATALI{% else %}DOSYA YOK{% endif %}"
          - "4. QRadar IP (192.168.121.21): {% if not qradar_ip_kontrol.changed %}DOGRU{% else %}HATALI{% endif %}"
          - "5. Audit log blogu: {% if not audit_log_blogu_kontrol.changed %}DOGRU{% else %}HATALI{% endif %}"
          - "6. bash.conf: {% if bash_conf_stat.stat.exists and bash_conf_icerik_kontrol is defined and not bash_conf_icerik_kontrol.changed %}DOGRU{% elif not bash_conf_stat.stat.exists %}DOSYA YOK{% else %}HATALI{% endif %}"
          - "7. bash.log izin: {% if bash_log_stat.stat.exists and bash_log_stat.stat.mode == '0640' %}DOGRU{% elif not bash_log_stat.stat.exists %}DOSYA YOK{% else %}HATALI{% endif %}"
          - "8. 50-default.conf: {% set sonuc = 'DOGRU' %}{% for item in default50_kontroller.results if item.changed %}{% set sonuc = 'HATALI' %}{% endfor %}{{ sonuc }}"
          - "9. Rsyslog servis: {% if rsyslog_durum is defined %}AKTIF{% else %}AKTIF DEGIL{% endif %}"
          - "10. Auditd servis: {% if auditd_durum is defined %}AKTIF{% else %}AKTIF DEGIL{% endif %}"
          - "************************************************"
