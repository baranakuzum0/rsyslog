---
- name: BASH VE AUDIT LOG KONFIGURASYON KONTROL PLAYBOOK'U
  hosts: all
  gather_facts: yes
  vars:
    # Tam metinler - harfine kadar kontrol edilecek
    bash_log_kodu: |
      PORT=`who am i | awk '{ print $5 }' | sed 's/(//g' | sed 's/)//g'`
      logger -p local5.debug -t "Bash $LOGNAME $$" User $LOGNAME logged from $PORT
      function history_to_syslog
      {
      declare cmd
      declare p_dir
      declare LOG_NAME
      cmd=$(history 1)
      cmd=$(echo $cmd |awk '{print substr($0,length($1)+2)}')
      p_dir=$(pwd)
      LOG_NAME=$(echo $LOGNAME)
      if [ "$cmd" != "$old_command" ]; then
      logger -p local5.debug -- Bash SESSION = $$, from_remote_host = $PORT, USER = $LOG_NAME, PWD = $p_dir, CMD = "${cmd}"
      fi
      old_command=$cmd
      }
      trap history_to_syslog DEBUG || EXIT

    audit_log_bloku: |
      $ModLoad imfile
      $InputFileName /var/log/audit/audit.log
      $InputFileTag tag_audit_log_.$hostname:
      $InputFileStateFile audit_log
      $InputFileSeverity info
      $InputFileFacility local6
      $InputRunFileMonitor

    # Sayi ile baslamayan degisken adi
    default_50_kurallar:
      - "auth,authpriv.*                 /var/log/auth.log"
      - "*.*;auth,authpriv.none          -/var/log/syslog"
      - "cron.*                          /var/log/cron.log"
      - "local1.*                        /var/log/sudo.log"
      - "mail.err                        /var/log/mail.err"
      - "*.emerg                         :omusrmsg:*"

  tasks:
    # TASK 1: /etc/profile kontrolu
    - name: "KONTROL-1: /etc/profile icinde bash log kodu tam metin kontrolu"
      ansible.builtin.lineinfile:
        path: /etc/profile
        line: "{{ bash_log_kodu }}"
        state: present
      check_mode: yes
      register: profile_kontrol
      failed_when: false

    - name: "RAPOR-1: /etc/profile durumu"
      ansible.builtin.debug:
        msg: "=== /etc/profile: {% if not profile_kontrol.changed %}DOGRU - Tam metin eslesiyor{% else %}HATALI veya EKSIK{% endif %} ==="

    # TASK 2: /root/.bashrc kontrolu
    - name: "KONTROL-2: /root/.bashrc icinde bash log kodu tam metin kontrolu"
      ansible.builtin.lineinfile:
        path: /root/.bashrc
        line: "{{ bash_log_kodu }}"
        state: present
      check_mode: yes
      register: bashrc_kontrol
      failed_when: false

    - name: "RAPOR-2: /root/.bashrc durumu"
      ansible.builtin.debug:
        msg: "=== /root/.bashrc: {% if not bashrc_kontrol.changed %}DOGRU - Tam metin eslesiyor{% else %}HATALI veya EKSIK{% endif %} ==="

    # TASK 3: Audit plugin dosyasini bul
    - name: "KONTROL-3: Audit plugin dosyasinin varligi"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/audisp/plugins.d/syslog.conf
        - /etc/audit/plugins.d/syslog.conf
      register: audit_plugin_stat

    - name: "RAPOR-3: Audit plugin dosyasi"
      ansible.builtin.debug:
        msg: "=== Audit Plugin Dosyasi: {% for item in audit_plugin_stat.results if item.stat.exists %}{{ item.stat.path }}{% else %}BULUNAMADI{% endfor %} ==="

    # TASK 4: Audit plugin "active = yes" kontrolu
    - name: "Set audit plugin dosyasi degiskeni"
      ansible.builtin.set_fact:
        audit_plugin_dosyasi: "{{ (audit_plugin_stat.results | selectattr('stat.exists', 'equalto', true) | first).stat.path | default('') }}"
      when: audit_plugin_stat.results | selectattr('stat.exists', 'equalto', true) | list | length > 0

    - name: "KONTROL-4: Audit plugin icinde 'active = yes' harfine kadar kontrol"
      ansible.builtin.lineinfile:
        path: "{{ audit_plugin_dosyasi }}"
        line: "active = yes"
        state: present
      check_mode: yes
      register: audit_plugin_kontrol
      when: audit_plugin_dosyasi | length > 0

    - name: "RAPOR-4: Audit plugin 'active = yes' durumu"
      ansible.builtin.debug:
        msg: "=== Audit plugin active=yes: {% if audit_plugin_kontrol is defined and not audit_plugin_kontrol.changed %}DOGRU{% elif audit_plugin_kontrol is defined %}HATALI{% else %}DOSYA YOK{% endif %} ==="
      when: audit_plugin_kontrol is defined

    # TASK 5: QRadar IP kontrolu
    - name: "KONTROL-5: rsyslog.conf icinde QRadar IP (192.168.121.21) tam metin kontrolu"
      ansible.builtin.lineinfile:
        path: /etc/rsyslog.conf
        line: "192.168.121.21"
        state: present
      check_mode: yes
      register: qradar_ip_kontrol
      failed_when: false

    - name: "RAPOR-5: QRadar IP durumu"
      ansible.builtin.debug:
        msg: "=== QRadar IP (192.168.121.21): {% if not qradar_ip_kontrol.changed %}DOGRU{% else %}HATALI veya EKSIK{% endif %} ==="

    # TASK 6: Audit log blogu kontrolu
    - name: "KONTROL-6: rsyslog.conf icinde audit log blogu tam metin kontrolu"
      ansible.builtin.blockinfile:
        path: /etc/rsyslog.conf
        block: "{{ audit_log_bloku }}"
        marker: "# {mark} AUDIT LOG BLOCK"
        state: present
      check_mode: yes
      register: audit_log_blogu_kontrol
      failed_when: false

    - name: "RAPOR-6: Audit log blogu durumu"
      ansible.builtin.debug:
        msg: "=== Audit log blogu: {% if not audit_log_blogu_kontrol.changed %}DOGRU{% else %}HATALI veya EKSIK{% endif %} ==="

    # TASK 7: bash.conf kontrolu
    - name: "KONTROL-7: bash.conf dosyasinin varligi"
      ansible.builtin.stat:
        path: /etc/rsyslog.d/bash.conf
      register: bash_conf_stat

    - name: "KONTROL-7B: bash.conf icerigi tam metin kontrolu"
      ansible.builtin.lineinfile:
        path: /etc/rsyslog.d/bash.conf
        line: "local5.debug           /var/log/bash.log"
        state: present
      check_mode: yes
      register: bash_conf_icerik_kontrol
      when: bash_conf_stat.stat.exists
      failed_when: false

    - name: "RAPOR-7: bash.conf durumu"
      ansible.builtin.debug:
        msg: "=== bash.conf: Dosya={% if bash_conf_stat.stat.exists %}VAR{% else %}YOK{% endif %} | Icerik={% if bash_conf_icerik_kontrol is defined and not bash_conf_icerik_kontrol.changed %}DOGRU{% elif bash_conf_icerik_kontrol is defined %}HATALI{% else %}YOK{% endif %} ==="

    # TASK 8: bash.log izin kontrolu
    - name: "KONTROL-8: bash.log dosya izinleri (640 olmali)"
      ansible.builtin.stat:
        path: /var/log/bash.log
      register: bash_log_stat

    - name: "RAPOR-8: bash.log durumu"
      ansible.builtin.debug:
        msg: "=== bash.log: Dosya={% if bash_log_stat.stat.exists %}VAR{% else %}YOK{% endif %} | Izin={% if bash_log_stat.stat.exists and bash_log_stat.stat.mode == '0640' %}DOGRU (640){% elif bash_log_stat.stat.exists %}HATALI ({{ bash_log_stat.stat.mode }}){% else %}N/A{% endif %} ==="

    # TASK 9: 50-default.conf kurallari
    - name: "KONTROL-9: 50-default.conf her bir kuralin tam metin kontrolu"
      ansible.builtin.lineinfile:
        path: /etc/rsyslog.d/50-default.conf
        line: "{{ item }}"
        state: present
      check_mode: yes
      register: default50_kontroller
      loop: "{{ default_50_kurallar }}"
      failed_when: false

    - name: "RAPOR-9: 50-default.conf durumu (ozet)"
      ansible.builtin.debug:
        msg: 
          - "=== 50-default.conf KONTROL SONUCLARI ==="
          - "{% for item in default50_kontroller.results %}"
          - "  Kural: {{ item.line }} -> {% if not item.changed %}DOGRU{% else %}HATALI veya EKSIK{% endif %}"
          - "{% endfor %}"

    # TASK 10: Servis durumlari
    - name: "KONTROL-10A: Rsyslog servis durumu"
      ansible.builtin.shell: systemctl is-active rsyslog
      register: rsyslog_durum
      failed_when: false
      changed_when: false

    - name: "RAPOR-10A: Rsyslog servisi"
      ansible.builtin.debug:
        msg: "=== Rsyslog Servisi: {% if rsyslog_durum.rc == 0 %}AKTIF{% else %}AKTIF DEGIL{% endif %} ==="

    - name: "KONTROL-10B: Auditd servis durumu"
      ansible.builtin.shell: systemctl is-active auditd
      register: auditd_durum
      failed_when: false
      changed_when: false

    - name: "RAPOR-10B: Auditd servisi"
      ansible.builtin.debug:
        msg: "=== Auditd Servisi: {% if auditd_durum.rc == 0 %}AKTIF{% else %}AKTIF DEGIL{% endif %} ==="

    # FINAL RAPOR
    - name: "===== FINAL RAPOR ====="
      ansible.builtin.debug:
        msg:
          - "************************************************"
          - "KONTROL SONUCLARI"
          - "************************************************"
          - "1. /etc/profile: {% if not profile_kontrol.changed %}DOGRU{% else %}HATALI{% endif %}"
          - "2. /root/.bashrc: {% if not bashrc_kontrol.changed %}DOGRU{% else %}HATALI{% endif %}"
          - "3. Audit plugin active=yes: {% if audit_plugin_kontrol is defined and not audit_plugin_kontrol.changed %}DOGRU{% elif audit_plugin_kontrol is defined %}HATALI{% else %}DOSYA YOK{% endif %}"
          - "4. QRadar IP (192.168.121.21): {% if not qradar_ip_kontrol.changed %}DOGRU{% else %}HATALI{% endif %}"
          - "5. Audit log blogu: {% if not audit_log_blogu_kontrol.changed %}DOGRU{% else %}HATALI{% endif %}"
          - "6. bash.conf: {% if bash_conf_stat.stat.exists and bash_conf_icerik_kontrol is defined and not bash_conf_icerik_kontrol.changed %}DOGRU{% elif not bash_conf_stat.stat.exists %}DOSYA YOK{% else %}HATALI{% endif %}"
          - "7. bash.log: {% if bash_log_stat.stat.exists and bash_log_stat.stat.mode == '0640' %}DOGRU{% elif not bash_log_stat.stat.exists %}DOSYA YOK{% else %}HATALI{% endif %}"
          - "8. Rsyslog servis: {% if rsyslog_durum.rc == 0 %}AKTIF{% else %}AKTIF DEGIL{% endif %}"
          - "9. Auditd servis: {% if auditd_durum.rc == 0 %}AKTIF{% else %}AKTIF DEGIL{% endif %}"
          - "************************************************"
