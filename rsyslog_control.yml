---
- name: Linux Security Compliance Report (CLEAN OUTPUT)
  hosts: all
  become: yes
  gather_facts: no

  tasks:

  # =====================================================
  # HEADER
  # =====================================================
  - name: Start report
    debug:
      msg:
        - "=================================================="
        - "        LINUX SECURITY COMPLIANCE REPORT"
        - "=================================================="
        - "HOST: {{ inventory_hostname }}"
        - "=================================================="

  # =====================================================
  # BASH LOGGING CHECK
  # =====================================================
  - name: Check /etc/profile bash logging
    shell: grep -q "history_to_syslog" /etc/profile && echo "YES" || echo "NO"
    register: p1
    changed_when: false

  - name: Check /root/.bashrc bash logging
    shell: grep -q "history_to_syslog" /root/.bashrc && echo "YES" || echo "NO"
    register: p2
    changed_when: false

  - debug:
      msg:
        - "[BASH LOGGING]"
        - "/etc/profile  : {{ p1.stdout }}"
        - "/root/.bashrc : {{ p2.stdout }}"

  # =====================================================
  # AUDIT PLUGIN
  # =====================================================
  - name: Check audit plugin
    shell: grep -R "active *= *yes" /etc/audit /etc/audisp 2>/dev/null && echo "YES" || echo "NO"
    register: audit
    changed_when: false

  - debug:
      msg:
        - "[AUDIT]"
        - "plugin : {{ audit.stdout }}"

  # =====================================================
  # QRADAR
  # =====================================================
  - name: Check QRadar forwarding
    shell: grep -R "192.168.121.21" /etc/rsyslog* 2>/dev/null && echo "YES" || echo "NO"
    register: qradar
    changed_when: false

  - debug:
      msg:
        - "[QRADAR]"
        - "forward : {{ qradar.stdout }}"

  # =====================================================
  # AUDIT IMFILE
  # =====================================================
  - name: Check audit rsyslog pipeline
    shell: grep -q "/var/log/audit/audit.log" /etc/rsyslog* && echo "YES" || echo "NO"
    register: audit_pipe
    changed_when: false

  - debug:
      msg:
        - "[AUDIT PIPE]"
        - "imfile : {{ audit_pipe.stdout }}"

  # =====================================================
  # BASH LOG FILE SYSTEM
  # =====================================================
  - name: Check bash log system
    shell: test -f /var/log/bash.log && grep -q "local5.debug" /etc/rsyslog.d/ && echo "YES" || echo "NO"
    register: bashlog
    changed_when: false

  - debug:
      msg:
        - "[BASH LOG FILE]"
        - "system : {{ bashlog.stdout }}"

  # =====================================================
  # RSYSLOG DEFAULT RULES
  # =====================================================
  - name: Check rsyslog default rules
    shell: |
      grep -q "auth,authpriv" /etc/rsyslog.d/50-default.conf &&
      grep -q "cron" /etc/rsyslog.d/50-default.conf &&
      grep -q "local1" /etc/rsyslog.d/50-default.conf &&
      grep -q "mail.err" /etc/rsyslog.d/50-default.conf &&
      grep -q "emerg" /etc/rsyslog.d/50-default.conf &&
      echo "YES" || echo "NO"
    register: rules
    changed_when: false

  - debug:
      msg:
        - "[RSYSLOG RULES]"
        - "default : {{ rules.stdout }}"

  # =====================================================
  # FINAL REPORT
  # =====================================================
  - name: Final report
    debug:
      msg:
        - "=================================================="
        - "FINAL COMPLIANCE REPORT"
        - "=================================================="
        - "BASH PROFILE   : {{ p1.stdout }}"
        - "BASH RC        : {{ p2.stdout }}"
        - "AUDIT PLUGIN   : {{ audit.stdout }}"
        - "QRADAR         : {{ qradar.stdout }}"
        - "AUDIT PIPE     : {{ audit_pipe.stdout }}"
        - "BASH LOG       : {{ bashlog.stdout }}"
        - "RSYSLOG RULES   : {{ rules.stdout }}"
        - "=================================================="
