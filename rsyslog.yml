---
- name: RSYSLOG + Auditd + Bash Log Kurulumu
  hosts: all
  become: yes

  vars:
    qradar_ip: "192.168.112.20"

    bash_log_entries:
      - line: |
          PORT=`who am i | awk '{ print $5 }' | sed 's/(//g' | sed 's/)//g'`
        regexp: '^PORT='

      - line: 'logger -p local5.debug -t "Bash $LOGNAME $$" User $LOGNAME logged from $PORT'
        regexp: '^logger -p local5.debug'

      - line: 'function history_to_syslog {'
        regexp: '^function history_to_syslog'

      - line: 'declare cmd'
        regexp: '^declare cmd'

      - line: 'declare p_dir'
        regexp: '^declare p_dir'

      - line: 'declare LOG_NAME'
        regexp: '^declare LOG_NAME'

      - line: 'cmd=$(history 1)'
        regexp: '^cmd='

      - line: 'cmd=$(echo $cmd | awk "{print substr($0,length($1)+2)}")'
        regexp: '^cmd=\$\(echo \$cmd'

      - line: 'p_dir=$(pwd)'
        regexp: '^p_dir='

      - line: 'LOG_NAME=$(echo $LOGNAME)'
        regexp: '^LOG_NAME='

      - line: 'if [ "$cmd" != "$old_command" ]; then'
        regexp: '^if \[ "\$cmd" != "\$old_command"'

      - line: 'logger -p local5.debug -- Bash SESSION=$$, from_remote_host=$PORT, USER=$LOG_NAME, PWD=$p_dir, CMD="${cmd}"'
        regexp: '^logger -p local5.debug -- Bash'

      - line: 'fi'
        regexp: '^fi$'

      - line: 'old_command=$cmd'
        regexp: '^old_command='

      - line: '}'
        regexp: '^\}$'

      - line: 'trap history_to_syslog DEBUG || EXIT'
        regexp: '^trap history_to_syslog DEBUG'

    rsyslog_lines:
      - { line: "*.* @{{ qradar_ip }}:514", regexp: '^\*.\* @.*:514' }
      - { line: "$ModLoad imfile", regexp: '^\$ModLoad imfile' }
      - { line: "$InputFileName /var/log/audit/audit.log", regexp: '^\$InputFileName /var/log/audit/audit.log' }
      - { line: "$InputFileTag tag_audit_log_.$hostname:", regexp: '^\$InputFileTag tag_audit_log_.*' }
      - { line: "$InputFileStateFile audit_log", regexp: '^\$InputFileStateFile audit_log' }
      - { line: "$InputFileSeverity info", regexp: '^\$InputFileSeverity info' }
      - { line: "$InputFileFacility local6", regexp: '^\$InputFileFacility local6' }
      - { line: "$InputRunFileMonitor", regexp: '^\$InputRunFileMonitor' }

  tasks:

    # 🔥 RSYSLOG SAFE CHECK (EKLENDİ)
    - name: rsyslog kurulu mu kontrol et
      command: systemctl is-active rsyslog
      register: rsyslog_state
      failed_when: false
      changed_when: false

    # 🔥 RSYSLOG YOKSA KUR (EKLENDİ)
    - name: rsyslog yoksa kur
      apt:
        name: rsyslog
        state: present
        update_cache: yes
      when: rsyslog_state.rc != 0

    # 🔥 RSYSLOG START (SADECE YOKSA / BOZUKSA)
    - name: rsyslog servisini başlat
      service:
        name: rsyslog
        state: started
        enabled: yes
      failed_when: false

    - name: Auditd kurulumu
      apt:
        name: auditd
        state: present
        update_cache: yes

    - name: Auditd servisini aktif et
      service:
        name: auditd
        state: started
        enabled: yes

    - name: Audit syslog plugin aktif et
      lineinfile:
        path: /etc/audit/plugins.d/syslog.conf
        regexp: '^active\s*='
        line: 'active = yes'
        create: yes

    - name: Bash log dosyasını oluştur
      file:
        path: /var/log/bash.log
        state: touch
        owner: root
        group: adm
        mode: '0640'

    - name: Bash log script ekle (/etc/profile)
      blockinfile:
        path: /etc/profile
        marker: "# {mark} ANSIBLE_BASH_LOG"
        block: |
          {% for entry in bash_log_entries %}
          {{ entry.line }}
          {% endfor %}
        insertafter: EOF

    - name: Bash log script ekle (/root/.bashrc)
      blockinfile:
        path: /root/.bashrc
        marker: "# {mark} ANSIBLE_BASH_LOG"
        block: |
          {% for entry in bash_log_entries %}
          {{ entry.line }}
          {% endfor %}
        insertafter: EOF

    - name: Rsyslog bash config ekle
      copy:
        dest: /etc/rsyslog.d/bash.conf
        content: "local5.debug    /var/log/bash.log\n"
        owner: root
        group: root
        mode: '0644'

    - name: Rsyslog main config update
      lineinfile:
        path: /etc/rsyslog.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        insertafter: EOF
      loop: "{{ rsyslog_lines }}"

    - name: 50-default.conf log kuralları
      lineinfile:
        path: /etc/rsyslog.d/50-default.conf
        line: "{{ item.line }}"
        regexp: "{{ item.regexp }}"
      loop:
        - { line: "auth,authpriv.* /var/log/auth.log", regexp: '^auth,authpriv\.' }
        - { line: "*.*;auth,authpriv.none -/var/log/syslog", regexp: '^\*\.\*;auth,authpriv\.none' }
        - { line: "cron.* /var/log/cron.log", regexp: '^cron\.' }
        - { line: "local1.* /var/log/sudo.log", regexp: '^local1\.' }
        - { line: "mail.err /var/log/mail.err", regexp: '^mail\.err' }
        - { line: "*.emerg :omusrmsg:*", regexp: '^\*\.emerg' }

    - name: rsyslog config test
      command: rsyslogd -N1
      register: rsyslog_check
      failed_when: false
      changed_when: false

    - name: Rsyslog restart (EN SON - zorla)
      service:
        name: rsyslog
        state: restarted
      failed_when: false

    - name: Rsyslog status kontrol
      command: systemctl status rsyslog --no-pager
      register: rsyslog_status
      failed_when: false

    - name: Rsyslog output
      debug:
        var: rsyslog_status.stdout_lines
