---
- name: RSYSLOG + Auditd + Bash Log (PROD SAFE)
  hosts: all
  become: yes

  vars:
    qradar_ip: "192.168.121.20"

  tasks:

  # ----------------------------
  # PACKAGES
  # ----------------------------
  - name: Auditd install
    package:
      name: audit
      state: present

  - name: Rsyslog install
    package:
      name: rsyslog
      state: present

  # ----------------------------
  # SERVICES (önce enable, sonra config)
  # ----------------------------
  - name: Enable services
    systemd:
      name: "{{ item }}"
      enabled: yes
    loop:
      - auditd
      - rsyslog

  # ----------------------------
  # AUDIT SYSLOG INTEGRATION
  # ----------------------------
  - name: Enable audit syslog plugin
    lineinfile:
      path: /etc/audit/plugins.d/syslog.conf
      regexp: '^active\s*='
      line: 'active = yes'
      create: yes

  - name: Start auditd
    systemd:
      name: auditd
      state: started

  # ----------------------------
  # BASH LOGGING SETUP
  # ----------------------------
  - name: Create bash log file
    file:
      path: /var/log/bash.log
      state: touch
      owner: root
      group: root
      mode: '0640'

  - name: Add bash logger (profile)
    blockinfile:
      path: /etc/profile
      marker: "# {mark} ANSIBLE_BASH_LOG"
      block: |
        export PROMPT_COMMAND='history -a >(logger -p local5.debug -t "bash[$$]")'

  # ----------------------------
  # RSYSLOG CONFIG (SAFE WAY)
  # ----------------------------

  - name: QRadar forwarding config
    copy:
      dest: /etc/rsyslog.d/10-qradar.conf
      content: |
        *.* @@{{ qradar_ip }}:514

  - name: Bash log config
    copy:
      dest: /etc/rsyslog.d/20-bash.conf
      content: |
        local5.*    /var/log/bash.log

  - name: Audit log forwarding
    copy:
      dest: /etc/rsyslog.d/30-audit.conf
      content: |
        local6.*    /var/log/audit/audit.log

  # ----------------------------
  # SYNTAX CHECK (KRİTİK)
  # ----------------------------
  - name: Check rsyslog config
    command: rsyslogd -N1
    register: rsyslog_check
    changed_when: false

  - name: Fail if rsyslog config invalid
    fail:
      msg: "Rsyslog config hatalı! önce düzelt."
    when: rsyslog_check.rc != 0

  # ----------------------------
  # RESTART (EN SON)
  # ----------------------------
  - name: Restart rsyslog
    systemd:
      name: rsyslog
      state: restarted

  # ----------------------------
  # STATUS DEBUG
  # ----------------------------
  - name: Show rsyslog status
    command: systemctl status rsyslog --no-pager
    register: rsyslog_status

  - debug:
      var: rsyslog_status.stdout_lines
