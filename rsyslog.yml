---
- name: Self Healing RSYSLOG + Audit + QRadar Stack
  hosts: all
  become: yes

  vars:
    qradar_ip: "192.168.121.20"

  tasks:

  # ==================================================
  # 1. PACKAGES (UNIVERSAL)
  # ==================================================
  - name: Install rsyslog
    package:
      name: rsyslog
      state: present

  - name: Install audit
    package:
      name: audit
      state: present
    ignore_errors: yes   # bazı distrolarda farklı olabilir

  # ==================================================
  # 2. CORE RSYSLOG ENGINE (KRİTİK FIX)
  # ==================================================
  - name: Ensure rsyslog base config NEVER EMPTY
    copy:
      dest: /etc/rsyslog.conf
      backup: yes
      content: |
        #############################
        # CORE RSYSLOG ENGINE
        #############################

        module(load="imuxsock")
        module(load="imjournal")

        # load all custom rules
        include(file="/etc/rsyslog.d/*.conf")

        # SAFE FALLBACK (prevents: no active actions)
        *.info /var/log/messages

  # ==================================================
  # 3. SAFE DIRECTORIES
  # ==================================================
  - name: Ensure rsyslog.d exists
    file:
      path: /etc/rsyslog.d
      state: directory

  # ==================================================
  # 4. QRADAR (SAFE RAINERSCRIPT)
  # ==================================================
  - name: QRadar forwarding (SAFE MODE)
    copy:
      dest: /etc/rsyslog.d/10-qradar.conf
      content: |
        action(type="omfwd"
               target="{{ qradar_ip }}"
               port="514"
               protocol="tcp"
               action.resumeRetryCount="-1"
               queue.type="linkedList"
               queue.size="10000")

  # ==================================================
  # 5. BASH LOGGING
  # ==================================================
  - name: Bash logging config
    copy:
      dest: /etc/rsyslog.d/20-bash.conf
      content: |
        local5.*    /var/log/bash.log

  - name: Create bash log file
    file:
      path: /var/log/bash.log
      state: touch
      mode: '0640'

  # ==================================================
  # 6. AUDIT SAFE ENABLE
  # ==================================================
  - name: Enable audit syslog plugin safely
    lineinfile:
      path: /etc/audit/plugins.d/syslog.conf
      regexp: '^active\s*='
      line: 'active = yes'
      create: yes
    ignore_errors: yes

  # ==================================================
  # 7. SAFE VALIDATION (NO FAIL MODE)
  # ==================================================
  - name: Validate rsyslog config (non blocking)
    command: rsyslogd -N1
    register: rsyslog_check
    changed_when: false
    failed_when: false

  - name: Show rsyslog validation result
    debug:
      var: rsyslog_check.stderr_lines

  # ==================================================
  # 8. START SERVICES (GUARANTEED)
  # ==================================================
  - name: Start rsyslog safely
    systemd:
      name: rsyslog
      state: restarted
      enabled: yes

  - name: Start auditd safely
    systemd:
      name: auditd
      state: restarted
      enabled: yes
    ignore_errors: yes
