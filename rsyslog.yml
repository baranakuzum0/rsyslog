---
- name: Universal Logging Stack (Audit + Rsyslog + QRadar)
  hosts: all
  become: yes

  vars:

    qradar_ip: "192.168.121.20"

    # ----------------------------
    # PACKAGE MAPPING (KRİTİK)
    # ----------------------------
    audit_pkg_map:
      Debian: auditd
      Ubuntu: auditd
      RedHat: audit
      CentOS: audit
      Rocky: audit
      AlmaLinux: audit
      Suse: audit
      SLES: audit

    rsyslog_pkg_map:
      Debian: rsyslog
      Ubuntu: rsyslog
      RedHat: rsyslog
      CentOS: rsyslog
      Rocky: rsyslog
      AlmaLinux: rsyslog
      Suse: rsyslog
      SLES: rsyslog

    audit_pkg: "{{ audit_pkg_map[ansible_distribution] | default('auditd') }}"
    rsyslog_pkg: "{{ rsyslog_pkg_map[ansible_distribution] | default('rsyslog') }}"

  tasks:

  # ----------------------------
  # PACKAGES
  # ----------------------------
  - name: Install audit package
    package:
      name: "{{ audit_pkg }}"
      state: present

  - name: Install rsyslog package
    package:
      name: "{{ rsyslog_pkg }}"
      state: present

  # ----------------------------
  # ENABLE SERVICES (SAFE ORDER)
  # ----------------------------
  - name: Enable services
    systemd:
      name: "{{ item }}"
      enabled: yes
    loop:
      - auditd
      - rsyslog

  # ----------------------------
  # AUDITD CONFIG
  # ----------------------------
  - name: Enable audit syslog plugin
    lineinfile:
      path: /etc/audit/plugins.d/syslog.conf
      regexp: '^active\s*='
      line: 'active = yes'
      create: yes

  - name: Start auditd
    systemd:
      name: auditd
      state: started

  # ----------------------------
  # BASH LOG (LOCAL5)
  # ----------------------------
  - name: Create bash log file
    file:
      path: /var/log/bash.log
      state: touch
      mode: '0640'

  - name: Bash logging to syslog
    blockinfile:
      path: /etc/profile
      marker: "# ANSIBLE BASH LOG"
      block: |
        export PROMPT_COMMAND='history -a >(logger -p local5.debug -t bash[$$])'

  # ----------------------------
  # RSYSLOG CONFIG (SAFE METHOD)
  # ----------------------------
  - name: QRadar forward config
    copy:
      dest: /etc/rsyslog.d/10-qradar.conf
      content: |
        *.* @@{{ qradar_ip }}:514

  - name: Bash log config
    copy:
      dest: /etc/rsyslog.d/20-bash.conf
      content: |
        local5.* /var/log/bash.log

  - name: Audit log local file
    copy:
      dest: /etc/rsyslog.d/30-audit.conf
      content: |
        local6.* /var/log/audit/audit.log

  # ----------------------------
  # SYNTAX CHECK (CRITICAL SAFETY)
  # ----------------------------
  - name: Check rsyslog config
    command: rsyslogd -N1
    register: rsyslog_check
    changed_when: false
    failed_when: rsyslog_check.rc != 0

  # ----------------------------
  # START SERVICES (LAST STEP)
  # ----------------------------
  - name: Start rsyslog
    systemd:
      name: rsyslog
      state: restarted
      enabled: yes

  - name: Start auditd (final ensure)
    systemd:
      name: auditd
      state: restarted
