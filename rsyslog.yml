---
- name: RSYSLOG + AUDIT + QRADAR (Production Safe One Page)
  hosts: all
  become: yes

  vars:
    qradar_ip: "192.168.121.21"

  tasks:

  # ==================================================
  # PACKAGES (SAFE INSTALL)
  # ==================================================
  - name: Install rsyslog
    package:
      name: rsyslog
      state: present
    failed_when: false

  - name: Install auditd
    package:
      name: audit
      state: present
    failed_when: false

  # ==================================================
  # ENABLE SERVICES
  # ==================================================
  - name: Enable rsyslog + auditd
    systemd:
      name: "{{ item }}"
      enabled: yes
    loop:
      - rsyslog
      - auditd
    failed_when: false

  - name: Start services
    systemd:
      name: "{{ item }}"
      state: started
    loop:
      - rsyslog
      - auditd
    failed_when: false

  # ==================================================
  # RSYSLOG CORE ENGINE (NEVER PATCH EXISTING)
  # ==================================================
  - name: Ensure rsyslog base engine exists
    copy:
      dest: /etc/rsyslog.conf
      backup: yes
      content: |
        module(load="imuxsock")
        module(load="imjournal")

        include(file="/etc/rsyslog.d/*.conf")

        *.info;mail.none;authpriv.none;cron.none /var/log/messages
        authpriv.* /var/log/secure
        mail.* /var/log/maillog
        cron.* /var/log/cron

  # ==================================================
  # DROP-IN CONFIGS (SAFE LAYER)
  # ==================================================

  - name: QRadar forwarding (SAFE TCP)
    copy:
      dest: /etc/rsyslog.d/10-qradar.conf
      content: |
        action(type="omfwd"
               target="{{ qradar_ip }}"
               port="514"
               protocol="tcp"
               action.resumeRetryCount="-1"
               queue.type="linkedList"
               queue.size="10000")
    failed_when: false

  - name: Bash logging
    copy:
      dest: /etc/rsyslog.d/20-bash.conf
      content: |
        local5.*    /var/log/bash.log

  - name: Audit log rule
    copy:
      dest: /etc/rsyslog.d/30-audit.conf
      content: |
        local6.*    /var/log/audit/audit.log

  # ==================================================
  # BASH LOG FILE
  # ==================================================
  - name: Create bash log file
    file:
      path: /var/log/bash.log
      state: touch
      mode: '0640'

  # ==================================================
  # AUDIT SYSLOG ENABLE
  # ==================================================
  - name: Enable audit syslog plugin
    lineinfile:
      path: /etc/audit/plugins.d/syslog.conf
      regexp: '^active\s*='
      line: 'active = yes'
      create: yes
    failed_when: false

  # ==================================================
  # VALIDATION (NON BLOCKING)
  # ==================================================
  - name: Validate rsyslog config
    command: rsyslogd -N1
    register: rsyslog_check
    changed_when: false
    failed_when: false

  # ==================================================
  # FINAL RESTART (SAFE)
  # ==================================================
  - name: Restart rsyslog
    systemd:
      name: rsyslog
      state: restarted
      enabled: yes
    failed_when: false

  - name: Restart auditd
    systemd:
      name: auditd
      state: restarted
      enabled: yes
    failed_when: false

  # ==================================================
  # DEBUG OUTPUT
  # ==================================================
- name: Check rsyslog service
  service_facts:

- name: Show rsyslog state
  debug:
    msg: "{{ ansible_facts.services['rsyslog.service'].state }}"
